name: Build and publish

on:
  schedule:
    - cron: "5 0 * * *"      # daily at 00:05 UTC, refreshes today's AUD/NPR rate
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Run offline tests
        run: python tests/test_build.py
      - name: Build the site
        env:
          # Your domain, for example gorkhapay.com.np. Set under Settings > Secrets and variables > Actions > Variables.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SITE_BASE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || steps.pages.outputs.base_url }}
        run: python scripts/build.py --out public
      - name: Test and build the TakeHome pay calculator (served at /pay/)
        env:
          SITE_BASE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}/pay/', vars.CUSTOM_DOMAIN) || format('{0}/pay/', steps.pages.outputs.base_url) }}
        run: |
          python paycheck/tests/test_paycheck.py
          python paycheck/build.py --out public/pay
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
